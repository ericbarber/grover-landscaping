services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: grover_landscaping
      POSTGRES_USER: grover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grover -d grover_landscaping"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: ${GROVER_IMAGE:?Set GROVER_IMAGE in .release.env}
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_ENV: local
      AUTH_MODE: local_review
      DATABASE_URL: postgres://grover:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/grover_landscaping
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
      PHOTO_STORAGE_MODE: local
      NOTIFICATION_DISPATCH_MODE: disabled
      RUST_LOG: grover_landscaping_api=info,tower_http=info
    ports:
      - "127.0.0.1:10000:10000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
