" text-anchor="middle">4</text><text x="724" y="724" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Publish readiness</text><text x="692" y="756" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Customers · Properties · Crew · Route · Notifications.</text>
