<text x="58" y="342" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#6d7d78" text-anchor="start">One product story that adapts to four audiences without</text><text x="58" y="365" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#6d7d78" text-anchor="start">fragmenting the brand.</text><rect x="58" y="382" width="154" height="42" rx="12" fill="#2d6654" stroke="#2d6654" stroke-width="2"/><text x="135" y="408" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Request a demo</text><rect x="764" y="142" width="596" height="260" rx="18" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><rect x="790" y="170" width="544" height="34" rx="8" fill="#e8eee9" stroke="#e8eee9" stroke-width="2"/><text x="806" y="192" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#6d7d78" text-anchor="start">PRODUCT PREVIEW — ROUTE + EVIDENCE + REPORT</text><rect x="792" y="220" width="240" height="150" rx="10" fill="#f7f4ec" stroke="#bcc8c3" stroke-width="2"/><rect x="1048" y="220" width="284" height="68" rx="10" fill="#f7f4ec" stroke="#bcc8c3" stroke-width="2"/><rect x="1048" y="302" width="284" height="68" rx="10" fill="#f7f4ec" stroke="#bcc8c3" stroke-width="2"/><text x="44" y="483" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="900" fill="#2d6654" text-anchor="start">CHOOSE YOUR VIEW</text><rect x="44" y="500" width="322" height="52" rx="12" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><text x="205" y="532" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f4540" text-anchor="middle">Yard owner</text><rect x="384" y="500" width="322" height="52" rx="12" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><text x="545" y="532" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f4540" text-anchor="middle">Property manager</text><rect x="724" y="500" width="322" height="52" rx="12" fill="#2d6654" stroke="#2d6654" stroke-width="2"/><text x="885" y="532" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Landscaping company</text><rect x="1064" y="500" width="322" height="52" rx="12" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><text x="1225" y="532" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f4540" text-anchor="middle">Crew lead</text><rect x="44" y="582" width="428" height="176" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="72" cy="613" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="72" y="618" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">1</text><text x="98" y="618" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Hero</text><text x="66" y="650" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Outcome-led headline, short proof statement,</text><text x="66" y="670" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">primary CTA, workspace sign-in, product preview.</text><rect x="500" y="582" width="428" height="176" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="528" cy="613" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="528" y="618" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">2</text><text x="554" y="618" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Audience selector</text><text x="522" y="650" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Yard owner · Property manager · Landscaping</text><text x="522" y="670" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">company · Crew lead.</text><rect x="956" y="582" width="428" height="176" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="984" cy="613" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="984" y="618" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">3</text><text x="1010" y="618" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Plan · Care · Proof</text><text x="978" y="650" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Interactive three-step explanation with</text><text x="978" y="670" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">persona-specific outcomes.</text><rect x="44" y="787" width="428" height="176" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="72" cy="818" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="72" y="823" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">4</text><text x="98" y="823" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Capability proof</text><text x="66" y="855" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Routes, offline work, evidence, reports, recovery,</text><text x="66" y="875" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">and access boundaries.</text><rect x="500" y="787" width="428" height="176" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="528" cy="818" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="528" y="823" font-family="Inter, Arial, sans-serif" font-