<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Shared report and bid pages wireframe</title>
  <desc id="desc">Customer-safe proof and decisions outside the authenticated workspace.</desc>
  <rect width="1200" height="980" fill="#f7f4ec"/>
  <rect x="24" y="20" width="1152" height="70" rx="18" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><text x="50" y="61" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="900" fill="#2d6654" text-anchor="start">GROVER</text><text x="1148" y="61" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#6d7d78" text-anchor="end">Secure customer link</text><text x="48" y="140" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" fill="#17352f" text-anchor="start">Shared report and bid pages</text><text x="48" y="170" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#6d7d78" text-anchor="start">Customer-safe proof and decisions outside the authenticated workspace.</text><rect x="930" y="122" width="138" height="30" rx="15" fill="#e8eee9" stroke="#e8eee9" stroke-width="2"/><text x="999" y="142" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">CURRENT TARGET</text><rect x="48" y="232" width="1104" height="142" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="76" cy="263" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="76" y="268" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">1</text><text x="102" y="268" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Service identity</text><text x="70" y="300" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Property, service date, provider, and immutable delivery status.</text><rect x="48" y="400" width="1104" height="142" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="76" cy="431" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="76" y="436" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">2</text><text x="102" y="436" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Evidence</text><text x="70" y="468" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Before/after photos, checklist, notes, and completed add-ons.</text><rect x="630" y="424" width="150" height="92" rx="9" fill="#e8eee9" stroke="#e8eee9" stroke-width="2"/><rect x="794" y="424" width="150" height="92" rx="9" fill="#e8eee9" stroke="#e8eee9" stroke-width="2"/><text x="705" y="476" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#6d7d78" text-anchor="middle">BEFORE</text><text x="869" y="476" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#6d7d78" text-anchor="middle">AFTER</text><rect x="48" y="568" width="1104" height="142" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="76" cy="599" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="76" y="604" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">3</text><text x="102" y="604" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Decision area</text><text x="70" y="636" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">Approve or reject an active bid; explain expired or revoked links.</text><rect x="48" y="736" width="1104" height="142" rx="14" fill="#ffffff" stroke="#bcc8c3" stroke-width="2"/><circle cx="76" cy="767" r="15" fill="#e8eee9" stroke="#2d6654" stroke-width="2"/><text x="76" y="772" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#2d6654" text-anchor="middle">4</text><text x="102" y="772" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#17352f" text-anchor="start">Trust footer</text><text x="70" y="804" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6d7d78" text-anchor="start">No manager-only IDs, internal notes, or unrelated account data.</text>
  <text x="28" y="958" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d7d78" text-anchor="start">Grover design study · CURRENT TARGET · low fidelity</text>
