etter-spacing="0">1 of 2</text><rect x="524" y="792" width="372" height="6" rx="3" fill="#dce6de" stroke="none" stroke-width="1"/><rect x="524" y="792" width="186" height="6" rx="3" fill="#24594a" stroke="none" stroke-width="1"/><rect x="524" y="828" width="372" height="82" rx="12" fill="#f6f2e8" stroke="none" stroke-width="1"/><circle cx="548" cy="853" r="7" fill="#c99f55" stroke="none" stroke-width="1"/><text x="566" y="857" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="650" fill="#17342d" text-anchor="start" letter-spacing="0">After photo required before completion</text><text x="548" y="884" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="500" fill="#5d6e67" text-anchor="start" letter-spacing="0">Keep the recovery path beside the blocker.</text><g filter="url(#token-shadow)"><rect x="948" y="620" width="440" height="322" rx="18" fill="#173f35" stroke="none" stroke-width="1"/></g><text x="974" y="657" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="760" fill="#ffffff" text-anchor="start" letter-spacing="0">Material and voice</text><text x="974" y="692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="800" fill="#dec79d" text-anchor="start" letter-spacing="1.3">01</text><text x="1010" y="692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="740" fill="#ffffff" text-anchor="start" letter-spacing="0">Calm before clever</text><text x="1010" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="500" fill="#d4e2dc" text-anchor="start" letter-spacing="0">Reduce noise; preserve the next useful action.</text><text x="974" y="750" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="800" fill="#dec79d" text-anchor="start" letter-spacing="1.3">02</text><text x="1010" y="750" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="740" fill="#f