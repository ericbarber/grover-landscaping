EAUTIFULLY CONNECTED</text><text x="54" y="232" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="61" font-weight="600" fill="#17342d" text-anchor="start" letter-spacing="-0.8">Plan every visit.</text><text x="54" y="301" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="61" font-weight="600" fill="#17342d" text-anchor="start" letter-spacing="-0.8">Care with confidence.</text><text x="54" y="370" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="61" font-weight="600" fill="#bd6848" text-anchor="start" letter-spacing="-0.8">Prove the work.</text><text x="58" y="426" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">One calm operating system for the office, the field,</text><text x="58" y="454" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">and every customer who expects to see the difference.</text><rect x="56" y="498" width="198" height="46" rx="12" fill="#173f35" stroke="#173f35" stroke-width="1"/><text x="155" y="527" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="750" fill="#ffffff" text-anchor="middle" letter-spacing="0">Request a walkthrough</text><rect x="268" y="498" width="148" height="46" rx="12" fill="#fffdf8" stroke="#d8ddd7" stroke-width="1"/><text x="342" y="527" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="750" fill="#173f35" text-anchor="middle" letter-spacing="0">Explore the product</text><circle cx="66" cy="586" r="18" fill="#fffdf8" stroke="#d8ddd7" stroke-width="1"/><path d="M60 585l4 4 8-10" fill="none" stroke="#173f35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="581" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#17342d" text-anchor="start" letter-spacing="0">Built for weak-signal field work</text><text x="94" y="603" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">Offline-safe progress and evidence</text><circle cx="300" cy="586" r="18" fill="#fffdf8" stroke="#d8ddd7" stroke-width="1"/><path d="M294 585l4 4 8-10" fill="none" stroke="#173f35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="328" y="581" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#17342d" text-anchor="start" letter-spacing="0">Customer-ready proof</text><text x="328" y="603" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">Reports with a clear audit trail</text><g filter="url(#shadow)"><rect x="772" y="466" width="430" height="176" rx="18" fill="#fffdf8" stroke="none" stroke-width="1"/><rect x="798" y="492" width="154" height="28" rx="14" fill="#d9eee4" stroke="none" stroke-width="1"/><text x="875" y="510.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="750" fill="#173f35" text-anchor="middle" letter-spacing="0.35">TODAY · NORTH CREW</text><text x="798" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="780" fill="#17342d" text-anchor="start" letter-spacing="0">6 of 8 properties complete</text><rect x="798" y="572" width="350" height="8" rx="4" fill="#dce6de" stroke="none" stroke-width="1"/><rect x="798" y="572" width="263" height="8" rx="4" fill="#24594a" stroke="none" stroke-width="1"/><circle cx="813" cy="610" r="5" fill="#24594a" stroke="none" stroke-width="1"/><text x="829" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" fill="#5d6e67" text-anchor="start" letter-spacing="0">Photos synced</text><circle cx="946" cy="610" r="5" fill="#c99f55" stroke="none" stroke-width="1"/><text x="962" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" fill="#5d6e67" text-anchor="start" letter-spacing="0">1 report needs review</text></g><rect x="0" y="706" width="1440" height="92" rx="0" fill="#173f35" stroke="none" stroke-width="1"/><text x="56" y="744" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#dec79d" text-anchor="start" letter-spacing="1.6">ONE SHARED VIEW OF THE DAY</text><text x="376" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="760" fill="#ffffff" text-anchor="start" letter-spacing="0">12</text><text x="424" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" fill="#d9e6e1" text-anchor="start" letter-spacing="0">Routes published</text><line x1="600" y1="728" x2="600" y2="776" stroke="#456e62" stroke-width="1"/><text x="628" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="760" fill="#ffffff" text-anchor="start" letter-spacing="0">46</text><text x="676" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" fill="#d9e6e1" text-anchor="start" letter-spacing="0">Stops completed</text><line x1="852" y1="728" x2="852" y2="776" stroke="#456e62" stroke-width="1"/><text x="880" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="760" fill="#ffffff" text-anchor="start" letter-spacing="0">18</text><text x="928" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" fill="#d9e6e1" text-anchor="start" letter-spacing="0">Proof ready</text><line x1="1104" y1="728" x2="1104" y2="776" stroke="#456e62" stroke-width="1"/><text x="1132" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="760" fill="#ffffff" text-anchor="start" letter-spacing="0">3</text><text x="1180" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" fill="#d9e6e1" text-anchor="start" letter-spacing="0">Exceptions owned</text><text x="54" y="858" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="38" font-weight="600" fill="#17342d" text-anchor="start" letter-spacing="0">A complete operating rhythm.</text><text x="54" y="895" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">Each step is useful on its own—and stronger because the next team can trust it.</text><rect x="54" y="934" width="416" height="202" rx="18" fill="#fffdf8" stroke="#d8ddd7" stroke-width="1"/><text x="80" y="970" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#bd6848" text-anchor="start" letter-spacing="1.8">01</text><text x="80" y="1018" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="29" font-weight="650" fill="#17342d" text-anchor="start" letter-spacing="0">Plan</text><text x="80" y="1054" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">Balance crews, routes, service scope, and the exceptions</text><text x="80" y="1077" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">that could derail the day.</text><text x="80" y="1100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0"></text><circle cx="428" cy="1092" r="18" fill="#dce6de" stroke="none" stroke-width="1"/><path d="M425 1087l5 5-5 5" fill="none" stroke="#173f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="502" y="934" width="416" height="202" rx="18" fill="#173f35" stroke="#173f35" stroke-width="1"/><text x="528" y="970" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#dec79d" text-anchor="start" letter-spacing="1.8">02</text><text x="528" y="1018" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="29" font-weight="650" fill="#ffffff" text-anchor="start" letter-spacing="0">Care</text><text x="528" y="1054" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#d8e6e0" text-anchor="start" letter-spacing="0">Keep field teams focused on the current stop,</text><text x="528" y="1077" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#d8e6e0" text-anchor="start" letter-spacing="0">required work, and reliable capture.</text><text x="528" y="1100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#d8e6e0" text-anchor="start" letter-spacing="0"></text><circle cx="876" cy="1092" r="18" fill="#315f53" stroke="none" stroke-width="1"/><path d="M873 1087l5 5-5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="950" y="934" width="416" height="202" rx="18" fill="#fffdf8" stroke="#d8ddd7" stroke-width="1"/><text x="976" y="970" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#bd6848" text-anchor="start" letter-spacing="1.8">03</text><text x="976" y="1018" font-family="'Iowan Old Style', 'Palatino Linotype', Georgia, serif" font-size="29" font-weight="650" fill="#17342d" text-anchor="start" letter-spacing="0">Proof</text><text x="976" y="1054" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">Turn completed work into reviewable evidence, customer reports,</text><text x="976" y="1077" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0">and billing readiness.</text><text x="976" y="1100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="450" fill="#5d6e67" text-anchor="start" letter-spacing="0"></text><circle cx="1324" cy="1092" r="18" fill="#dce6de" stroke="none" stroke-width="1"/><path d="M1321 1087l5 5-5 5" fill="none" stroke="#173f35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
