name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate expected project layout
        run: |
          test -f README.md
          test -d docs
          test -d backend
          test -d frontend
          test -d infra
          test -f Dockerfile
          test -f render.yaml

      - name: Validate shell, release, and Pi deployment contracts
        run: |
          bash -n infra/pi/install-host-dependencies.sh scripts/*.sh scripts/test-fixtures/*.sh
          bash scripts/validate-changes.test.sh
          bash scripts/release-preflight.test.sh
          bash scripts/smoke-production.test.sh
          bash scripts/deploy-pi.test.sh
          node --test scripts/smoke-workspace-rollout.test.mjs
          node --test scripts/validate-protected-release-evidence.test.mjs

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: grover_landscaping
          POSTGRES_USER: grover
          POSTGRES_PASSWORD: grover
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grover -d grover_landscaping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://grover:grover@localhost:5432/grover_landscaping
      RUST_LOG: grover_landscaping_api=debug,tower_http=debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Apply database migrations
        run: >-
          /usr/bin/time -f
          'backend_migrate elapsed=%e user=%U system=%S max_rss_kb=%M'
          cargo run --bin migrate
        working-directory: backend

      - name: Check Rust formatting
        run: >-
          /usr/bin/time -f
          'backend_fmt elapsed=%e user=%U system=%S max_rss_kb=%M'
          cargo fmt --all -- --check
        working-directory: backend

      - name: Run Rust lint checks
        run: >-
          /usr/bin/time -f
          'backend_clippy elapsed=%e user=%U system=%S max_rss_kb=%M'
          cargo clippy --all-targets --all-features -- -D warnings
        working-directory: backend

      - name: Run Rust tests
        run: >-
          /usr/bin/time -f
          'backend_test elapsed=%e user=%U system=%S max_rss_kb=%M'
          cargo test --all
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: >-
          /usr/bin/time -f
          'frontend_install elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm ci
        working-directory: frontend

      - name: Test frontend dependency audit policy
        run: >-
          /usr/bin/time -f
          'frontend_audit_policy_test elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm run test:audit-security
        working-directory: frontend

      - name: Audit frontend dependencies
        run: >-
          /usr/bin/time -f
          'frontend_security_audit elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm run audit:security
        working-directory: frontend

      - name: Type-check frontend
        run: >-
          /usr/bin/time -f
          'frontend_typecheck elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm run typecheck
        working-directory: frontend

      - name: Run frontend tests
        run: >-
          /usr/bin/time -f
          'frontend_test elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm test
        working-directory: frontend

      - name: Build frontend
        run: >-
          /usr/bin/time -f
          'frontend_build elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm run build
        working-directory: frontend

  browser-journeys:
    name: Chromium, Firefox, and WebKit journeys
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: >-
          /usr/bin/time -f
          'browser_dependency_install elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: >-
          /usr/bin/time -f
          'browser_engine_install elapsed=%e user=%U system=%S max_rss_kb=%M'
          npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - name: Validate frontend design reviews
        run: |
          /usr/bin/time -f \
            'current_frontend_review elapsed=%e user=%U system=%S max_rss_kb=%M' \
            node design/tools/validate-current-frontend-review.mjs
          /usr/bin/time -f \
            'frontend_truth_recovery elapsed=%e user=%U system=%S max_rss_kb=%M' \
            node design/tools/validate-frontend-truth-recovery.mjs
          /usr/bin/time -f \
            'yard_owner_minimal_rollout elapsed=%e user=%U system=%S max_rss_kb=%M' \
            node design/tools/validate-yard-owner-minimal-rollout.mjs
          /usr/bin/time -f \
            'prototype_foundation elapsed=%e user=%U system=%S max_rss_kb=%M' \
            node design/tools/validate-prototype-foundation.mjs

      - name: Run responsive browser journeys
        run: >-
          /usr/bin/time -f
          'browser_journeys elapsed=%e user=%U system=%S max_rss_kb=%M'
          npm run test:e2e:cross-browser
        working-directory: frontend

      - name: Validate manager continuity handoffs
        run: >-
          /usr/bin/time -f
          'manager_recovery_journey elapsed=%e user=%U system=%S max_rss_kb=%M'
          npx playwright test --config playwright.config.ts
          --project=chromium-mobile e2e/local-role-workspaces.spec.ts
          --grep 'managed first unit withholds later manager feeds|manager Schedule opens a responsive route board and planning inspector|manager Recovery inspects an exception and returns to affected work|manager completion review opens the selected Job report workflow'
        working-directory: frontend

      - name: Validate mobile workspace clearance
        run: >-
          /usr/bin/time -f
          'mobile_workspace_clearance elapsed=%e user=%U system=%S max_rss_kb=%M'
          npx playwright test --config playwright.config.ts
          --project=chromium-mobile --project=webkit-mobile
          e2e/local-role-workspaces.spec.ts
          --grep 'mobile Home keeps its final action clear of fixed navigation'
        working-directory: frontend

      - name: Validate Crew Route truth
        run: >-
          /usr/bin/time -f
          'crew_route_truth elapsed=%e user=%U system=%S max_rss_kb=%M'
          npx playwright test --config playwright.config.ts
          --project=chromium-mobile e2e/local-role-workspaces.spec.ts
          --grep 'field Route prioritizes progress, current stop, and up-next work'
        working-directory: frontend

      - name: Validate Yard Owner protected recovery
        run: >-
          /usr/bin/time -f
          'yard_owner_recovery elapsed=%e user=%U system=%S max_rss_kb=%M'
          npx playwright test --config playwright.config.ts
          --project=chromium-mobile --project=webkit-mobile
          e2e/local-role-workspaces.spec.ts
          --grep 'yard owner protected visit recovery withholds facts and returns Home'
        working-directory: frontend

  pilot-assurance:
    name: Yard Owner pilot assurance contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate minimized monitoring and synthetic rehearsal
        run: node scripts/validate-yard-owner-pilot-assurance.mjs --rehearse

      - name: Test assurance validation failures
        run: node --test scripts/validate-yard-owner-pilot-assurance.test.mjs

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser-journeys, pilot-assurance]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grover-landscaping:ci
          cache-from: type=gha,scope=production-image
          cache-to: type=gha,mode=max,scope=production-image

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate development Cognito infrastructure
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate

      - name: Validate production Cognito infrastructure
        run: |
          terraform -chdir=infra/terraform/environments/prod init -backend=false
          terraform -chdir=infra/terraform/environments/prod validate

  deploy-pi-development:
    name: Deploy Pi development site
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.PI_DEPLOY_ENABLED == 'true'
    needs: [repository-checks, backend, frontend, browser-journeys, pilot-assurance, production-image, terraform]
    runs-on: ubuntu-24.04-arm
    environment: pi-development
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Pi application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: grover-landscaping:${{ github.sha }}
          cache-from: type=gha,scope=pi-development-arm64
          cache-to: type=gha,mode=max,scope=pi-development-arm64

      - name: Connect to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:grover-ci
          ping: ${{ vars.PI_TAILSCALE_HOST }}

      - name: Configure pinned SSH access
        env:
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          PI_TAILSCALE_HOST: ${{ vars.PI_TAILSCALE_HOST }}
        run: |
          set -euo pipefail
          [[ "$PI_TAILSCALE_HOST" =~ ^[a-zA-Z0-9.-]+\.ts\.net$ ]]
          test -n "$PI_SSH_PRIVATE_KEY"
          test -n "$PI_SSH_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pi_ssh_key"
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/pi_known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/pi_known_hosts"
          ssh -i "$RUNNER_TEMP/pi_ssh_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/pi_known_hosts" \
            "eric480@$PI_TAILSCALE_HOST" 'mkdir -p ~/grover-landscaping'

      - name: Transfer and activate Pi image
        env:
          PI_TAILSCALE_HOST: ${{ vars.PI_TAILSCALE_HOST }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/pi_ssh_key" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/pi_known_hosts")
          scp "${ssh_options[@]}" infra/pi/compose.yml scripts/deploy-pi.sh \
            "eric480@$PI_TAILSCALE_HOST:grover-landscaping/"
          docker save "grover-landscaping:$GITHUB_SHA" | gzip -1 | \
            ssh "${ssh_options[@]}" "eric480@$PI_TAILSCALE_HOST" \
              'bash -o pipefail -c "gzip -d | docker load"'
          ssh "${ssh_options[@]}" "eric480@$PI_TAILSCALE_HOST" \
            "bash ~/grover-landscaping/deploy-pi.sh '$GITHUB_SHA'"
